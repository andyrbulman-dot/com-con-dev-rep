  :root {
    --navy-bg-top: #070f1a;
    --navy-bg-bottom: #0b1826;
    --steel: #8a94a3;
    --steel-dim: #5a6473;
    --steel-light: #c7cfd9;
    --white-crisp: #f0f2f5;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    background: var(--navy-bg-bottom);
  }

  body {
    background: linear-gradient(180deg, var(--navy-bg-top), var(--navy-bg-bottom));
    color: var(--white-crisp);
    font-family: 'Plex Mono', monospace;
    position: relative;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: row;
    align-items: stretch;
    /* Slow fade-in on load, rather than the page just appearing —
       resolved by JS adding .loaded once everything is ready. Skipped
       entirely for anyone who has motion reduced in their OS settings. */
    opacity: 0;
    transition: opacity 1.8s ease;
  }
  body.loaded { opacity: 1; }
  @media (prefers-reduced-motion: reduce) {
    body { transition: none; opacity: 1; }
  }
  /* Left: branding, fixed in place. Right: every other section, in its
     own independently-scrolling pane — a visible scrollbar right there
     is the whole point, so it's obvious on first look that there's more
     to read, rather than the old single column that silently ran on
     below the fold with no cue at all. */
  .left-panel {
    flex: 0 0 38%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 64px 40px 40px;
    position: relative;
  }

  .right-panel {
    flex: 1;
    height: 100vh;
    overflow-y: auto;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    padding: 56px 56px 56px 8px;
    scrollbar-width: thin;
    scrollbar-color: var(--steel-dim) transparent;
  }
  .right-panel::-webkit-scrollbar { width: 10px; }
  .right-panel::-webkit-scrollbar-track { background: transparent; }
  .right-panel::-webkit-scrollbar-thumb { background: var(--steel-dim); border-radius: 6px; }

  @media (max-width: 860px) {
    body { flex-direction: column; height: auto; min-height: 100vh; overflow: visible; }
    .left-panel { flex: none; max-width: none; padding: 40px 24px 8px; }
    .right-panel { height: auto; overflow: visible; padding: 0 24px 60px; }
    .since-badge { margin-top: 28px; padding-top: 0; }
  }
  .hero {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  section {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* faint watermark shield centered behind the right-panel's stage —
     right-panel is a centered flex column, so this targets its true
     geometric center (accounting for the intentionally asymmetric
     padding that keeps a sliver of scrollbar visible on the right). */
  .watermark {
    position: fixed;
    top: 50%;
    left: calc(50vw + min(38vw, 440px) / 2 - 24px);
    width: min(48vw, 560px);
    height: min(48vw, 560px);
    transform: translate(-50%, -50%);
    background: url('shield-logo.png') center / contain no-repeat;
    opacity: 0.05;
    pointer-events: none;
  }
  @media (max-width: 860px) {
    .watermark { left: 50%; top: 22%; width: min(70vw, 420px); height: min(70vw, 420px); }
  }

  /* corner scan-frame brackets — the one signature element, used once */
  .bracket {
    position: fixed;
    width: 42px; height: 42px;
    border-color: var(--steel-dim);
    border-style: solid;
    border-width: 0;
    opacity: 0.7;
  }
  .bracket.tl { top: 28px; left: 28px; border-top-width: 3px; border-left-width: 3px; }
  .bracket.tr { top: 28px; right: 28px; border-top-width: 3px; border-right-width: 3px; }
  .bracket.bl { bottom: 28px; left: 28px; border-bottom-width: 3px; border-left-width: 3px; }
  .bracket.br { bottom: 28px; right: 28px; border-bottom-width: 3px; border-right-width: 3px; }
  .hero {
    position: relative;
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    max-width: 640px;
    width: 100%;
  }

  .wordmark {
    font-family: 'Bricolage', sans-serif;
    font-weight: 700;
    font-size: clamp(28px, 5.5vw, 46px);
    letter-spacing: 0.08em;
    color: var(--white-crisp);
  }

  .rule {
    width: 90px;
    height: 2px;
    background: var(--steel-dim);
    margin: 22px 0;
  }

  .shield-logo {
    width: clamp(100px, 16vw, 140px);
    height: auto;
    margin-bottom: 22px;
  }

  .domain {
    font-family: 'Plex Mono', monospace;
    font-size: 15px;
    letter-spacing: 0.12em;
    color: var(--steel);
  }

  /* pinned to the bottom of the fixed left column, since the branding
     block itself now sits up near the top */
  .since-badge {
    margin-top: auto;
    padding-top: 24px;
    font-family: 'Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--steel-dim);
  }
  .poem-title {
    font-family: 'Crimson', serif;
    font-style: italic;
    font-size: clamp(24px, 3.4vw, 30px);
    color: var(--white-crisp);
    margin-bottom: 40px;
  }
  .stanza {
    font-family: 'Crimson', serif;
    font-size: clamp(16px, 2.1vw, 18px);
    line-height: 1.8;
    color: var(--steel-light);
  }
  .stanza + .stanza { margin-top: 30px; }

  .stage-dots {
    display: flex;
    justify-content: center;
    gap: 7px;
    margin-top: 30px;
  }
  .stage-dots .dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--steel-dim);
    opacity: 0.5;
    transition: opacity 0.4s ease, background 0.4s ease;
  }
  .stage-dots .dot.active {
    background: var(--steel-light);
    opacity: 1;
  }

  footer {
    position: relative;
    z-index: 1;
    margin-top: 48px;
    font-size: 11px;
    letter-spacing: 0.1em;
    color: var(--steel-dim);
    text-transform: uppercase;
  }
</style>
</head>
<body>

  <div class="watermark"></div>
  <div class="bracket tl"></div>
  <div class="bracket tr"></div>
  <div class="bracket bl"></div>
  <div class="bracket br"></div>

  <div class="left-panel">
    <div class="hero">
      <img class="shield-logo" src="shield-logo.png" alt="Compliance Conduit shield logo">
      <div class="wordmark">COMPLIANCE CONDUIT</div>
      <div class="rule"></div>
      <div class="domain">complianceconduit.com</div>
    </div>
    <div class="since-badge">Since 2026</div>
  </div>
  <div class="right-panel">

  <div class="stage-wrap">
    <div class="stage" id="stage"></div>
    <div class="stage-dots" id="stage-dots"></div>
  </div>

  <footer></footer>

  </div><!-- /.right-panel -->

<script>
  // Slow fade-in on load — see the CSS transition on body/.loaded above.
  window.addEventListener('load', () => {
    requestAnimationFrame(() => document.body.classList.add('loaded'));
  });

  const MANIFESTO_HTML =
    '<div class="manifesto">' +
      '<p>We are told the system is rigged, change is impossible, and we are destined to choke in a fog of stagnation.</p>' +
      '<p>Yet, a single idea can be the winds of salvation, blowing away the fog of doubt and despair.</p>' +
    '</div>';

  // The poem stays whole — deliberately the one exception to "no
  // scroll". Splitting it across visits was worse: there's no guarantee
  // a returning visitor is on the same browser/device to pick up where
  // they left off, and even if they were, they likely won't remember
  // the previous stanza well enough to connect it to the next one.
  const POEM_HTML =
    '<div class="poem">' +
      '<div class="poem-eyebrow">A poem</div>' +
      '<div class="poem-title">Scars Became My Lessons</div>' +
      '<div class="stanza">I\u2019ve lived a life of battles,<br>that earned me many scars,<br>but these scars became my lessons,<br>though the blows they struck were hard.</div>' +
      '<div class="stanza">I\u2019ve had my share of triumphs<br>and all too much despair.<br>But the things my life has taught me,<br>have helped me to repair.</div>' +
      '<div class="stanza">The education that this gave me,<br>remains with me today.<br>As I move on to the future,<br>and I look back and say:</div>' +
      '<div class="stanza">I won\u2019t look back with sorrow,<br>or try to place the blame.<br>For I can see no sadness,<br>and I don\u2019t see the pain.</div>' +
      '<div class="stanza">I see obstacles I\u2019ve overcome,<br>and battles I\u2019ve survived.<br>The memory of pain a ghost,<br>and I\u2019m very much alive.</div>' +
      '<div class="stanza">From this knowledge I forged tools,<br>to build a house of stone,<br>and then when it\u2019s completed,<br>the world can call it home.</div>' +
    '</div>';
  // A single master list — the manifesto and the whole poem are each ONE
  // item. Only one item is ever in the stage at a time; nothing else
  // exists in the DOM alongside it until it fades to the next. No other
  // quotes here — this stays only your own words, nothing that hints at
  // what the site actually does.
  const STAGE_ITEMS = [MANIFESTO_HTML, POEM_HTML];

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // TESTING vs LIVE rotation speed — a visitor should generally see one
  // item per visit, only advancing to the next if they leave the page
  // open for a long stretch. Flip TESTING to false (or just change the
  // ms value) when this goes live.
  const TESTING = true;
  const ROTATE_INTERVAL_MS = TESTING ? 15000 : 5 * 60 * 1000; // testing: 15s — live: 5 min

  // One-at-a-time stage rotator. Swaps the stage's entire innerHTML as a
  // single fading unit, so whatever was showing before is fully gone —
  // not stacked, not peeking through — before the next item appears.
  function createRotator({ items, elId, dotsId, storageKey, intervalMs }) {
    const el = document.getElementById(elId);
    const dotsEl = dotsId ? document.getElementById(dotsId) : null;

    function nextValidIndex(fromIndex) {
      if (items.length === 0) return -1;
      let i = fromIndex;
      for (let attempts = 0; attempts < items.length; attempts++) {
        i = (i + 1) % items.length;
        if (items[i] && items[i].trim() !== '') return i;
      }
      return -1; // every entry is blank — nothing to show
    }

    function buildDots(activeIndex) {
      if (!dotsEl) return;
      dotsEl.innerHTML = '';
      for (let i = 0; i < items.length; i++) {
        if (!items[i] || items[i].trim() === '') continue; // no dot for blank placeholder slots
        const dot = document.createElement('div');
        dot.className = 'dot' + (i === activeIndex ? ' active' : '');
        dotsEl.appendChild(dot);
      }
    }

    function readLastIndex() {
      const raw = localStorage.getItem(storageKey);
      const parsed = raw === null ? -1 : parseInt(raw, 10);
      return Number.isFinite(parsed) ? parsed : -1;
    }

    function saveLastIndex(index) {
      try { localStorage.setItem(storageKey, String(index)); } catch (e) { /* private browsing etc — rotation still works, just won't persist */ }
    }

    let currentIndex = readLastIndex();

    function show(index, animate) {
      if (index === -1) { el.innerHTML = ''; if (dotsEl) dotsEl.innerHTML = ''; return; }
      const render = () => {
        el.innerHTML = items[index];
        buildDots(index);
        if (animate && !reduceMotion) requestAnimationFrame(() => el.classList.remove('fade'));
      };
      if (animate && !reduceMotion) {
        el.classList.add('fade');
        setTimeout(render, 600);
      } else {
        render();
      }
    }

    // Returning visitors resume from the NEXT item after where they left
    // off, rather than restarting the sequence from the beginning each time.
    currentIndex = nextValidIndex(currentIndex);
    saveLastIndex(currentIndex);
    show(currentIndex, false);

    setInterval(() => {
      currentIndex = nextValidIndex(currentIndex);
      saveLastIndex(currentIndex);
      show(currentIndex, true);
    }, intervalMs);
  }

  createRotator({
    items: STAGE_ITEMS,
    elId: 'stage',
    dotsId: 'stage-dots',
    storageKey: 'cc_last_stage_index',
    intervalMs: ROTATE_INTERVAL_MS
  });
</script>

</body>
</html>
